shared_rules:
  auth: OAuth 2.0 bearer token; scopes fixed at client registration and not self-expandable
  idempotency: 'HG-Idempotency-Key (UUID v4) on every POST; 409 on key reuse with a different payload'
  pagination: opaque _cursor from Bundle.link.next; never construct it; _offset discouraged
  errors: FHIR OperationOutcome in application/fhir+json; read issue[].code
  tracing: log X-HG-Request-Id from every response
  transport: TLS 1.2 or higher; plain HTTP rejected
