generated: '2026-08-14'
method: searched
source: https://developer.healthgorilla.com/reference/fhir-versions
description: >-
  Versioning, release and operational-transparency posture for the Health
  Gorilla API. Versions are selected by URL path (R4 current, STU3 legacy), an
  additional legacy REST API version can be pinned to the OAuth token at
  issuance, and releases ship on a numbered train published as a dated public
  changelog. Health Gorilla runs a public Atlassian status page with
  component-level health for the API server, both Patient360 gateways, and lab
  connectivity. No formal written deprecation policy with Sunset/Deprecation
  header support was found.
versioning:
  scheme: uri-path
  current: R4
  versions:
  - {version: R4, path: /fhir/R4, status: current, description: 'Direct access to normalized FHIR resources and most synchronous interactions.'}
  - {version: STU3, path: /fhir/3.0, status: legacy, description: 'Legacy workflows including Patient360 record retrieval and document aggregation.'}
  discovery: GET /fhir/R4/metadata
  docs: https://developer.healthgorilla.com/reference/fhir-versions
  token_pinned_version:
    parameter: hg_rest_api_version
    example: '10-01-2019'
    response_field: hg_rest_api_version
    error: 400 error=unsupported_api_version
    docs: https://developer.healthgorilla.com/reference/oauth-20-authentication
release_train:
  scheme: numbered release with dotted patch suffix
  format: v<train>_<patch>
  current: v2629_7
  cadence: rolling; patch releases ship days apart
  sandbox_first: >-
    New feature releases are deployed to the sandbox before production, giving
    integrators a window to test against upcoming changes.
  changelog: https://developer.healthgorilla.com/changelog
  detail: changelog/health-gorilla-changelog.yml
deprecation:
  policy_url: null
  policy_documented: false
  sunset_header: unknown
  deprecation_header: unknown
  note: >-
    No written deprecation or sunset policy was found on the developer portal,
    in the llms.txt documentation index, or on the website. STU3 is described as
    "legacy" and remains supported with no announced retirement date. Health
    Gorilla directs integrators requiring a different FHIR version or workflow to
    contact Support rather than to a published policy.
  searched:
  - https://developer.healthgorilla.com/llms.txt
  - https://developer.healthgorilla.com/reference/fhir-versions
  - https://developer.healthgorilla.com/reference/user-identity-api-versioning
