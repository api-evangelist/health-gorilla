finding: >-
  A first-party SDK gap. Health Gorilla ships a maintained API — ten release
  trains in the recent changelog window, the newest patch dated 2026-08-05 — but
  its only first-party code artifact has not been touched since January 2023, and
  no client library exists in any registry. The freshest client code for this API
  is maintained by a third party (Medplum, 2026-08-13).
