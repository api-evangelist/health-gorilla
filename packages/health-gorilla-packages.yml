source: >-
  npm registry search, PyPI, RubyGems, crates.io, NuGet, Maven Central,
  github.com/healthgorilla, and the Health Gorilla developer portal
description: >-
  Health Gorilla ships no first-party client library in any public package
  registry. Every registry was queried directly and every one missed. The company
  GitHub organisation holds two repositories: a sample-code repository last
  pushed in January 2023, and a fork of the MongoDB Java driver. Integrators are
  expected to call the FHIR REST API directly or to use a third-party FHIR
  toolkit. The only maintained packages carrying the Health Gorilla name are
  Medplum's connector modules, which are built and released by Medplum, not by
  Health Gorilla.
