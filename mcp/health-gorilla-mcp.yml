generated: '2026-08-14'
method: probed
status: published
source: https://developer.healthgorilla.com/mcp
description: >-
  Health Gorilla serves a live remote MCP endpoint from its own developer-portal
  host. An agent can reach it today at https://developer.healthgorilla.com/mcp —
  no install step, no local process. What it exposes, however, is the
  DOCUMENTATION, not the FHIR API: it is the MCP server ReadMe provisions for a
  hosted developer portal, so its tools search and read developer.healthgorilla.com
  pages rather than call api.healthgorilla.com. tools/list is auth-gated
  (JSON-RPC -32001 "Authorization required"), so the real tool schemas could not
  be read anonymously and none were invented. There is no MCP server in front of
  the FHIR API itself, and none is listed in the official MCP registry.
deployment:
  mode: remote
  endpoint: https://developer.healthgorilla.com/mcp
  auth: unknown
  verified: probed
  note: >-
    POST returns HTTP 401 with {"jsonrpc":"2.0","error":{"code":-32001,"message":
    "Authorization required"}}. No WWW-Authenticate header and no RFC 9728
    protected-resource metadata are served, so the authorization server backing
    this endpoint is not discoverable — a client cannot mechanically learn how to
    authenticate. Auth is therefore recorded as unknown rather than oauth.
server:
  name: health-gorilla-docs
  transport: http
  protocol: JSON-RPC 2.0 over HTTP (Streamable HTTP)
  url: https://developer.healthgorilla.com/mcp
  scope: documentation
  operator: Health Gorilla (developer portal hosted on ReadMe)
  platform: ReadMe
