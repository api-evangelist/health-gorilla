tools:
  discovered: []
  note: >-
    tools/list is auth-gated, so the live tool set and its inputSchemas could not
    be read. Health Gorilla's llms.txt indexes the documentation corpus but does
    not publish an MCP tool list, so there is no published fallback to record
    either. No tool names were guessed.
  requires: authenticated introspection
api_mcp_server:
  exists: false
  note: >-
    No MCP server fronts the Health Gorilla FHIR API. The FHIR surface is
    reachable only as REST at https://api.healthgorilla.com/fhir/R4 with an
    OAuth 2.0 bearer token. A candidate tool set derived from that surface is
    recorded in mcp/health-gorilla-tool-crosswalk.yml as rest_only capability,
    not as a server that exists.
