agent_readiness_finding: >-
  An agent that wants to read a patient chart, place a lab order or retrieve
  records across TEFCA has no tool to call. It must construct FHIR REST requests
  against api.healthgorilla.com and authenticate with OAuth 2.0. The MCP endpoint
  Health Gorilla does operate can answer questions about the documentation but
  cannot touch clinical data. The gap between the two is the whole clinical API.
