method: probed
source: live GET of /.well-known/* on every apis.yml + OpenAPI servers[] host
description: >-
  Well-known discovery probe of every Health Gorilla host. The FHIR API host
  api.healthgorilla.com serves two real machine-readable discovery documents at
  RFC 8615 paths — a SMART App Launch configuration and an OpenID Connect
  discovery document — and the web host serves the matching JWKS. All other
  probed paths miss. The marketing host www.healthgorilla.com is a Webflow
  single-page catch-all that answers HTTP 200 with the same HTML shell for every
  unknown path, so its 200s on /.well-known/* are soft-404s and are recorded as
  misses, not documents.
hosts:
- host: https://api.healthgorilla.com
  role: FHIR R4 API host (apis.yml baseURL + OpenAPI servers[])
  documents:
