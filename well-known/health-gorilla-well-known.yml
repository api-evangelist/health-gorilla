    spec: SMART App Launch 2.x (HL7)
    status: 200
    content_type: application/json
    file: health-gorilla-smart-configuration.json
    document: true
  - path: /.well-known/openid-configuration
    spec: OpenID Connect Discovery 1.0
    status: 200
    content_type: application/json
    file: health-gorilla-openid-configuration.json
    document: true
  - path: /.well-known/oauth-authorization-server
    spec: RFC 8414
    status: 404
    document: false
  - path: /.well-known/security.txt
    spec: RFC 9116
    status: 404
    document: false
  - path: /.well-known/api-catalog
